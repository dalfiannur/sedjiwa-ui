name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # `bun run test` runs two Vitest projects: jsdom unit tests and the
      # Storybook project, which drives a real Chromium via Playwright. Without
      # a browser the launch throws an *unhandled* error that aborts the entire
      # run — reporting "Tests no tests", so the unit suite never executed and
      # CI had never actually verified any of it.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run contrast
      - run: bun run build
      - name: Verify publishable artifact
        run: bun publish --dry-run

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to private registry
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish
