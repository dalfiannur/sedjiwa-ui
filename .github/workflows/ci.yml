name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # `bun run test` runs two Vitest projects: jsdom unit tests and the
      # Storybook project, which drives a real Chromium via Playwright. Without
      # a browser the launch throws an *unhandled* error that aborts the entire
      # run — reporting "Tests no tests", so the unit suite never executed and
      # CI had never actually verified any of it.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun run contrast
      - run: bun run build
      # `bun publish --dry-run` still authenticates against the registry and
      # fails with "missing authentication" on a runner with no token. `pack`
      # exercises the same `files` filter and prepublish build without auth.
      - name: Verify publishable artifact
        run: bun pm pack --dry-run

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Publishes to registry.npmjs.org (see publishConfig in package.json).
      # NPM_CONFIG_TOKEN is the env var bun reads for registry auth; the
      # secret must be an npm granular access token with publish rights on
      # @qyubit/sedjiwa-ui.
      - name: Publish to npm
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
